name: ScamCheck deploy (GitHub Pages)

# Manual on purpose: enable Pages first (Settings > Pages > Source: GitHub Actions), then run this.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scamcheck-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scamcheck/*.test.js
      - name: stage site
        run: |
          mkdir -p _site
          cp scamcheck/index.html scamcheck/apk.html scamcheck/mcp.html scamcheck/style.css \
             scamcheck/engine.js scamcheck/apkscan.js scamcheck/mcpaudit.js \
             scamcheck/app.js scamcheck/apk.js scamcheck/mcp.js scamcheck/config.js scamcheck/sw.js scamcheck/icon.svg \
             scamcheck/manifest.webmanifest _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

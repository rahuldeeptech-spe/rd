name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create from the current main, e.g. v1.1.0 (must equal VERSION in patchcheck.sh)'
        required: true

permissions:
  contents: write           # create the release
  id-token: write           # sign the build provenance attestation
  attestations: write       # store it
  artifact-metadata: write  # required by actions/attest for its storage record

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: tag must look like vX.Y.Z and match the version in the script
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "^VERSION=\"${TAG#v}\"" patchcheck.sh
      - name: tag must not be released already (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
      - name: tests
        run: |
          ./tests/run.sh
          ./tests/test_install.sh
          python3 -m unittest discover -s monitor
          ./monitor/test_open_review.sh
      - name: package
        run: |
          mkdir dist
          tar czf "dist/patchcheck-${TAG}.tar.gz" patchcheck.sh patchcheck.ps1 advisories.tsv monitor/monitor.py monitor/propose.py monitor/notify.py monitor/pages.py monitor/lockscan.py monitor/exposed.py monitor/phpini.py monitor/watchlist.tsv README.md LICENSE CHANGELOG.md
          cp install.sh dist/install.sh
          (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)
      - name: attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: verify the attestation we just made (a release without a verifiable attestation is not published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in "dist/patchcheck-${TAG}.tar.gz" dist/install.sh; do
            ok=0
            for attempt in 1 2 3; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "could not verify the attestation of $f"; exit 1; }
          done
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "patchcheck $TAG"

  image:
    name: container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
            ghcr.io/${{ github.repository }}:latest
      - name: attest the image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the weekly data-review workflow starts CI on its bot branch, because pushes made with GITHUB_TOKEN do not

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -x patchcheck.sh tests/run.sh install.sh tests/test_install.sh monitor/open_review.sh monitor/test_open_review.sh
      - name: tests
        run: ./tests/run.sh
      - name: installer tests (Linux only, they need sha256sum and GNU tar)
        if: runner.os == 'Linux'
        run: ./tests/test_install.sh
      - name: smoke run (real tools on the runner, report only)
        run: ./patchcheck.sh --no-processes || true

  powershell:
    name: powershell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: tests (PowerShell 7)
        shell: pwsh
        run: ./tests/run.ps1
      - name: tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/run.ps1
      - name: PSScriptAnalyzer (errors fail, warnings are printed)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Write-Host is deliberate: this is an interactive CLI report, not pipeline output.
          $r = foreach ($f in './patchcheck.ps1', './tests/run.ps1') {
            Invoke-ScriptAnalyzer -Path $f -ExcludeRule PSAvoidUsingWriteHost
          }
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if (@($r | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }

  monitor:
    name: monitor (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s monitor -v
      - run: ./monitor/test_open_review.sh

  data:
    name: advisories.tsv sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Homebrew formula parses
        run: ruby -c Formula/patchcheck.rb
      - name: every rule has 7 fields, a valid status and an https source
        run: |
          awk -F'\t' '!/^#/ && NF { if (NF != 7 || $3 !~ /^(fixed|eol|unconfirmed)$/ || $6 !~ /^https:\/\//) { print "bad rule: " $0; bad = 1 } } END { exit bad }' advisories.tsv

  action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: runs and reports (fail-on never, the runner's own tools are not under our control)
        id: pc
        uses: ./
        with:
          fail-on: never
      - name: exit code output is set
        run: test -n "${{ steps.pc.outputs.exit-code }}"
      - name: a bad fail-on value is rejected
        id: bad
        uses: ./
        continue-on-error: true
        with:
          fail-on: bogus
      - name: the rejection happened
        run: test "${{ steps.bad.outcome }}" = failure

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t patchcheck:ci .
      - name: prints its version
        run: docker run --rm patchcheck:ci --version | grep -Eq '^patchcheck [0-9]+\.[0-9]+\.[0-9]+$'
      - name: runs as a non-root user and exits with 0, 1 or 2
        run: |
          set +e
          id="$(docker run --rm --entrypoint id patchcheck:ci -u)"
          test "$id" != 0
          docker run --rm patchcheck:ci --no-processes
          rc=$?
          test "$rc" -le 2

  lockscan-live:
    name: lockscan against OSV.dev (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # talks to a public API; a hiccup there must not block merges
    steps:
      - uses: actions/checkout@v7
      - name: lodash 4.17.15 has known vulnerabilities, so the scan must exit 1
        run: |
          set +e
          python3 monitor/lockscan.py monitor/testdata/lock
          rc=$?
          test "$rc" -eq 1
